name: Windows x64

on:
  push:
    branches: [main, 'feat/windows-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache verified downloads
        id: downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Vendor/downloads
          key: windows-downloads-${{ hashFiles('scripts/windows/dependencies.json', 'scripts/windows/ffmpeg-dependencies.json') }}
      - name: Cache Cargo downloads and pinned Tauri CLI
        id: cargo
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri.exe
          key: windows-rust195-tauri2122-${{ hashFiles('shell/src-tauri/Cargo.lock') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - name: Frontend model and localization tests
        run: |
          node --test Tests/GraphModelTests.cjs Tests/I18nTests.cjs
          if ($LASTEXITCODE) { throw 'Frontend tests failed' }
      - name: Install pinned Swift and Rust
        id: toolchains
        run: |
          . ./scripts/windows/Common.ps1
          $installer = Get-VerifiedDownload $script:Manifest.downloads.swift
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet', '/norestart' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "Swift installer exit $($process.ExitCode)" }
          rustup toolchain install $script:Manifest.tools.rust --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { throw 'Rust installation failed' }
          rustup default $script:Manifest.tools.rust
          if ($LASTEXITCODE) { throw 'Rust selection failed' }
          if (!(Test-Path "$env:USERPROFILE/.cargo/bin/cargo-tauri.exe")) {
            cargo install tauri-cli --version $script:Manifest.tools.tauriCli --locked
            if ($LASTEXITCODE) { throw 'Tauri CLI installation failed' }
          }
      - name: Save installed Tauri CLI before build and smoke
        if: steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri.exe
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - name: Build CLI, GUI, NSIS and portable archive; run unit tests
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WINDOWS_CERTIFICATE_PFX || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          . ./scripts/windows/Enter-Environment.ps1
          $certificate = $null
          $pfx = Join-Path $env:RUNNER_TEMP 'digup-signing.pfx'
          try {
            if ($env:WINDOWS_CERTIFICATE_PFX) {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
              $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
              $env:DIGUP_CERT_THUMBPRINT = $certificate.Thumbprint
            }
            ./scripts/windows/Build.ps1 -Jobs 4
          } finally {
            if ($certificate) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" }
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }
      - name: Save dependency downloads even if compilation or tests fail
        if: always() && steps.toolchains.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Vendor/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Cache verified model bytes for real smoke
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build.noindex/windows/models
          key: windows-model-${{ hashFiles('Sources/DigUpKit/ModelFiles.swift') }}
      - name: Download/check pinned model and smoke the installed GUI and CLI
        run: |
          . ./scripts/windows/Enter-Environment.ps1
          $models = Join-Path (Get-Location) 'build.noindex/windows/models'
          $installer = Get-ChildItem 'build.noindex/windows/artifacts/*-setup.exe' | Select-Object -First 1
          ./scripts/windows/Smoke.ps1 -Installer $installer.FullName -Models $models -OutputDirectory 'build.noindex/windows/smoke'
          ./scripts/windows/Media-Smoke.ps1 -PackageDirectory 'build.noindex/windows/package' -Models $models -OutputDirectory 'build.noindex/windows/media-smoke'
          ./scripts/windows/Portable-Smoke.ps1 -Archive 'build.noindex/windows/artifacts/DigUp-windows-x64-portable.zip' -Models $models -OutputDirectory 'build.noindex/windows/portable-smoke'
          ./scripts/windows/Cyrillic-Progress-Smoke.ps1 -Archive 'build.noindex/windows/artifacts/DigUp-windows-x64-portable.zip' -Models $models -OutputDirectory 'build.noindex/windows/cyrillic-progress'
          ./scripts/windows/Search-Pagination-Smoke.ps1 -Archive 'build.noindex/windows/artifacts/DigUp-windows-x64-portable.zip' -Models $models -OutputDirectory 'build.noindex/windows/search-pagination'
          ./scripts/windows/Graph-Smoke.ps1 -Archive 'build.noindex/windows/artifacts/DigUp-windows-x64-portable.zip' -Models $models -OutputDirectory 'build.noindex/windows/graph-smoke'
          ./scripts/windows/UI-Features-Smoke.ps1 -Archive 'build.noindex/windows/artifacts/DigUp-windows-x64-portable.zip' -Models $models -OutputDirectory 'build.noindex/windows/ui-features'
          $env:DIGUP_MODELS = $models
          $env:DIGUP_CPU_ONLY = '1'
          $env:DIGUP_BACKENDS = "$PWD/Vendor/llama/lib"
          $env:DIGUP_FFMPEG = "$PWD/Vendor/ffmpeg/bin"
          $env:PATH = "$PWD/Vendor/llama/lib;$PWD/Vendor/pdfium/bin;$PWD/Vendor/ffmpeg/bin;$env:PATH"
          swift test --skip-build --filter ReferenceVectorTests
          if ($LASTEXITCODE) { throw 'Real model reference vector checks failed' }
      - name: Smoke device selection without requiring a GPU
        run: |
          $models = Join-Path (Get-Location) 'build.noindex/windows/models'
          ./scripts/windows/Gpu-Smoke.ps1 -PackageDirectory 'build.noindex/windows/package' -Models $models -OutputDirectory 'build.noindex/windows/gpu-policy-smoke' -NoGpuRequired
      - name: Upload build and smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DigUp-windows-x64-${{ github.sha }}
          if-no-files-found: error
          path: |
            build.noindex/windows/artifacts/*
            build.noindex/windows/smoke/*.json
            build.noindex/windows/smoke/*.txt
            build.noindex/windows/smoke/*.log
            build.noindex/windows/media-smoke/*.json
            build.noindex/windows/media-smoke/*.txt
            build.noindex/windows/portable-smoke/*.json
            build.noindex/windows/portable-smoke/*.txt
            build.noindex/windows/cyrillic-progress/*.json
            build.noindex/windows/cyrillic-progress/*.txt
            build.noindex/windows/cyrillic-progress/Отдельный индекс/worker*.log
            build.noindex/windows/search-pagination/*.json
            build.noindex/windows/search-pagination/*.txt
            build.noindex/windows/graph-smoke/*.json
            build.noindex/windows/graph-smoke/*.txt
            build.noindex/windows/graph-smoke/*.svg
            build.noindex/windows/ui-features/*.json
            build.noindex/windows/ui-features/*.txt
            build.noindex/windows/ui-features/*.svg
            build.noindex/windows/gpu-policy-smoke/*.json
            build.noindex/windows/gpu-policy-smoke/*.jsonl
            build.noindex/windows/gpu-policy-smoke/*.txt
            build.noindex/windows/package/licenses/**
            build.noindex/windows/package/runtime-inventory.json
            build.noindex/windows/diagnostics/**
            build.noindex/ffmpeg/dav1d-objects/meson-logs/**
            build.noindex/ffmpeg/objects/ffbuild/config.log
      # Publishing to Releases is intentionally separate: Win10/11 clean-VM and
      # redistribution checks in docs/windows.md must pass before public release.
