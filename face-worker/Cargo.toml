[package]
name = "digup-face-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Local YuNet and SFace inference helper for DigUp"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic", "directml"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "digup-face-worker"
path = "src/main.rs"
