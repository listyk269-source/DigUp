[package]
name = "digup-shell"
version = "0.1.10"
description = "DigUp for Windows and Linux: the tray icon, the hotkey and the search panel, over DigUp's helper"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-dialog = "2.8.2"
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
winreg = "=0.56.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
